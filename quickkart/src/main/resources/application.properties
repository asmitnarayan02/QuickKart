spring.application.name=quickkart
server.port=8080

spring.datasource.url=jdbc:postgresql://localhost:5432/quickkart_db
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Replace JWT_SECRET in non-development environments with a secret of at least 32 characters.
jwt.secret=${JWT_SECRET:quickkart-development-secret-change-me-2026}
jwt.expiration=${JWT_EXPIRATION:900000}
